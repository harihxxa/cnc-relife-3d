<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CNC Relief Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="header">
        <h1>CNC Relief Generator</h1>
        <p>Image → AI Depth → 3D Relief → STL</p>
    </header>


    <main class="main-container">

        <!-- Upload -->
        <section class="card">

            <h2>1. Upload Image</h2>

            <label for="imageInput" class="upload-area">

                <span class="upload-icon">＋</span>

                <span class="upload-title">
                    Select Image
                </span>

                <span class="upload-text">
                    JPG / JPEG / PNG
                </span>

            </label>

            <input
                type="file"
                id="imageInput"
                accept=".jpg,.jpeg,.png"
                hidden
            >

            <div
                id="imagePreviewContainer"
                class="image-preview-container"
                hidden
            >
                <img id="imagePreview" alt="Preview">
            </div>

        </section>


        <!-- Settings -->
        <section class="card">

            <h2>2. CNC Relief Settings</h2>

            <div class="settings">

                <div class="input-group">
                    <label for="modelWidth">
                        Model Width (mm)
                    </label>

                    <input
                        type="number"
                        id="modelWidth"
                        value="300"
                        min="10"
                        max="2000"
                    >
                </div>


                <div class="input-group">
                    <label for="modelHeight">
                        Model Height (mm)
                    </label>

                    <input
                        type="number"
                        id="modelHeight"
                        value="200"
                        min="10"
                        max="2000"
                    >
                </div>


                <div class="input-group">
                    <label for="reliefDepth">
                        Maximum Relief Depth (mm)
                    </label>

                    <input
                        type="number"
                        id="reliefDepth"
                        value="10"
                        min="1"
                        max="100"
                        step="0.5"
                    >
                </div>


                <div class="input-group">
                    <label for="baseThickness">
                        Base Thickness (mm)
                    </label>

                    <input
                        type="number"
                        id="baseThickness"
                        value="5"
                        min="1"
                        max="100"
                        step="0.5"
                    >
                </div>


                <div class="input-group">
                    <label for="detailLevel">
                        Relief Detail
                    </label>

                    <select id="detailLevel">

                        <option value="high">
                            High Detail
                        </option>

                        <option value="medium" selected>
                            Medium Detail
                        </option>

                        <option value="smooth">
                            Smooth
                        </option>

                    </select>
                </div>


                <div class="input-group">
                    <label for="backgroundMode">
                        Background
                    </label>

                    <select id="backgroundMode">

                        <option value="keep" selected>
                            Keep
                        </option>

                        <option value="remove">
                            Remove
                        </option>

                    </select>
                </div>

            </div>


            <button
                id="generateButton"
                class="generate-button"
                disabled
            >
                Generate 3D Relief
            </button>


            <div id="status" class="status">
                Upload an image to begin.
            </div>

        </section>


        <!-- Result -->
        <section class="card result-card">

            <h2>3. Generated STL</h2>

            <div id="resultArea" class="result-area">

                <div id="resultPlaceholder">
                    <div class="result-icon">3D</div>

                    <p>
                        Your CNC relief will appear here.
                    </p>
                </div>

            </div>


            <a
                id="downloadButton"
                class="download-button"
                hidden
            >
                Download STL
            </a>

        </section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
